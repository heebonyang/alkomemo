# main 에 푸시하면 Firebase 에 자동 배포 (웹페이지 + 데이터베이스 보안 규칙)
# 필요한 것: 저장소 Settings > Secrets and variables > Actions 에 FIREBASE_SERVICE_ACCOUNT (서비스 계정 키 JSON 전체)
# 비밀값이 없거나 .firebaserc 가 아직 YOUR_PROJECT_ID 이면 배포를 건너뜀
name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 배포할 수 있는지 확인
        id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # .firebaserc 는 확장자가 없어서 require 로는 JSON 으로 안 읽힘
          PROJECT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.firebaserc','utf8')).projects.default)")
          if [ -z "$SA" ]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT 비밀값이 없어서 배포를 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$PROJECT" = "YOUR_PROJECT_ID" ] || grep -q 'YOUR_API_KEY' public/config.js; then
            echo "::notice::.firebaserc 또는 public/config.js 에 Firebase 설정이 아직 없어서 배포를 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          fi

      - name: Firebase 배포
        if: steps.check.outputs.skip != 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          # 키 형식 확인: 비밀값은 출력하지 않고, 어느 계정·프로젝트 키인지만 알려 줌
          node -e '
            const fs = require("fs");
            let k;
            try { k = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); }
            catch (e) { console.log("::error title=배포 열쇠 형식 오류::FIREBASE_SERVICE_ACCOUNT 값이 JSON 이 아니에요. 키 파일 내용 전체({ 부터 } 까지)를 다시 붙여 넣어 주세요."); process.exit(1); }
            const miss = ["type", "project_id", "private_key", "client_email"].filter((f) => !k[f]);
            if (k.type !== "service_account" || miss.length) { console.log("::error title=배포 열쇠 형식 오류::서비스 계정 키가 아니에요 (type=" + k.type + ", 빠진 항목: " + (miss.join(", ") || "없음") + ")"); process.exit(1); }
            console.log("::notice title=배포 열쇠::" + k.client_email + " (프로젝트 " + k.project_id + ")");
          ' "$RUNNER_TEMP/sa.json" || { rm -f "$RUNNER_TEMP/sa.json"; exit 1; }
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npx --yes firebase-tools@13 deploy --only hosting,firestore:rules --project "${{ steps.check.outputs.project }}" --non-interactive 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          code=${PIPESTATUS[0]}
          rm -f "$RUNNER_TEMP/sa.json"
          if [ "$code" -ne 0 ]; then
            # 실패하면 마지막 줄들을 요약(annotation)으로 남겨서 로그를 안 열어도 원인이 보이게
            msg=$(grep -v '^\s*$' "$RUNNER_TEMP/deploy.log" | tail -n 15 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Firebase 배포 실패::${msg}"
            exit "$code"
          fi
